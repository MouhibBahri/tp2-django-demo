name: CI Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python manage.py test

  sast:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SAST - Bandit (fail on High severity findings)
        run: |
          pip install bandit
          bandit -r . -x ./.venv -lll -iii

  sca:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SCA - pip-audit (fail on any known dependency vulnerability)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  dast:
    runs-on: ubuntu-latest
    needs: [ sast, sca ]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t taskboard-ci:latest .
      - name: Run app container (ephemeral environment)
        run: docker run -d -p 8000:8000 --name taskboard-ci taskboard-ci:latest
      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 | grep -qE "^[23]"; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done
          echo "App did not become ready in time"
          docker logs taskboard-ci
          exit 1
      - name: DAST - OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8000'
          allow_issue_writing: false
          fail_action: true
          cmd_options: '-I'
      - name: Stop container
        if: always()
        run: docker stop taskboard-ci || true
