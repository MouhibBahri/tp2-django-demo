<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taskboard</title>
</head>
<body>
    <h1>Taskboard</h1>

    <form method="post">
        {{ form.as_p }}
        <button type="submit">Add task</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>
                {% if task.done %}<s>{{ task.title }}</s>{% else %}{{ task.title }}{% endif %}
                <form method="post" action="{% url 'task_toggle' task.pk %}" style="display:inline">
                    <button type="submit">{% if task.done %}Undo{% else %}Done{% endif %}</button>
                </form>
            </li>
        {% empty %}
            <li>No tasks yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
